<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>zieda</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      ;((location) => {
        if (!location.search.startsWith('?/')) return

        const [path, query] = location.search.slice(2).replace(/~and~/g, '&').split('&')

        window.history.replaceState(null, '', `${location.pathname}${path}${query ? `?${query}` : ''}${location.hash}`)
      })(window.location)
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
